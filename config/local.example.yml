interval_seconds: 30
retention_days: 7
services:
  - id: demo-http
    name: Página de demonstração
    type: http
    url: http://127.0.0.1:9000/
    expected_status: [200]
  - id: demo-tcp
    name: Porta do servidor web
    type: tcp
    host: 127.0.0.1
    port: 9000
  - id: demo-down
    name: Porta fechada de propósito
    type: tcp
    host: 127.0.0.1
    port: 9001
