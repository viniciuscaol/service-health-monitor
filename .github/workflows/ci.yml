name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Testes Python e JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: node --check monitor/static/app.js
  docker:
    name: Demonstração Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python3 scripts/smoke.py
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=80
      - name: Encerrar demonstração
        if: always()
        run: docker compose down -v
